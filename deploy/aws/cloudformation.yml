AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Anesthesia patient simulation host. One Ubuntu instance that runs the LiveKit
  patient worker, with API keys held in encrypted SSM SecureString parameters.
  Credentials never appear in this template, the AMI, user-data, or any
  git-tracked file: you write them to SSM from your own machine, and the
  instance pulls them at run time via an IAM role scoped to one parameter path.

Parameters:
  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Existing EC2 key pair, used for SSH from your laptop.

  MyIpCidr:
    Type: String
    Description: >
      Your public IP in CIDR form, e.g. 203.0.113.4/32. SSH is opened ONLY to
      this address. Never use 0.0.0.0/0.
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/(3[0-2]|[12]?\d)$'
    ConstraintDescription: Must be CIDR such as 203.0.113.4/32.

  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.micro, t3.small, t3.medium, c6i.large]
    Description: >
      t3.small is plenty. The work is remote API calls (Claude, Groq,
      ElevenLabs), not local compute; t3.micro can get tight during pip install.

  RepoUrl:
    Type: String
    Default: https://github.com/reddy7356/anesthesia-patient-simulation.git

  RepoBranch:
    Type: String
    Default: genspark_ai_developer

  LatestUbuntuAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
    Description: Resolved by SSM at deploy time. Do not hardcode an AMI id.

Resources:

  # --- Network -------------------------------------------------------------
  # NOTE: the parameters themselves are deliberately NOT created here.
  # CloudFormation cannot create SecureString parameters, and SSM refuses to
  # change an existing parameter's type, so a String placeholder could never
  # be upgraded to SecureString later. deploy/aws/put_secrets.sh creates them
  # as SecureString directly. The role below grants read access to the path
  # whether or not the values exist yet.

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Patient simulation host - SSH from one address only.
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref MyIpCidr
          Description: SSH / scp from the operator laptop only.
      # No inbound rule for the worker itself. The LiveKit agent dials OUT to
      # LiveKit Cloud over a websocket, so nothing needs to reach this box.
      # The health port (8091) stays private to the instance.
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS - Anthropic, Groq, ElevenLabs, LiveKit, GitHub, SSM.
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: apt package metadata.
        - IpProtocol: udp
          FromPort: 53
          ToPort: 53
          CidrIp: 0.0.0.0/0
          Description: DNS.
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-sg'

  # --- Instance identity ---------------------------------------------------
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      # Enables Session Manager, so you can get a shell without SSH at all.
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: read-own-secrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Scoped to THIS stack's path only. The instance cannot read
              # any other project's parameters.
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/psim/${AWS::StackName}/*'
              # Required to decrypt SecureString values.
              - Effect: Allow
                Action: kms:Decrypt
                Resource: !Sub 'arn:aws:kms:${AWS::Region}:${AWS::AccountId}:alias/aws/ssm'
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-role'

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  # --- Host ----------------------------------------------------------------
  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestUbuntuAmi
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyPairName
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds:
        - !GetAtt SecurityGroup.GroupId
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}'
      # user-data is world-readable from inside the instance metadata service
      # and is stored in plaintext by EC2. It therefore contains NO secrets:
      # only the repo checkout, system deps, and a fetch script that reads SSM
      # at run time under the instance role.
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          exec > >(tee -a /var/log/psim-bootstrap.log) 2>&1

          export DEBIAN_FRONTEND=noninteractive
          apt-get update -y
          # portaudio19-dev is needed by sounddevice, which livekit-agents
          # imports. A headless box has no audio device, but the library must
          # still load or `import livekit.agents` fails outright.
          apt-get install -y \
              python3-venv python3-dev build-essential git jq unzip curl \
              portaudio19-dev libsndfile1 ffmpeg

          # AWS CLI v2 (the snap/apt versions are unreliable on 24.04).
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp
          /tmp/aws/install --update
          rm -rf /tmp/awscliv2.zip /tmp/aws

          install -d -o ubuntu -g ubuntu /opt/psim
          sudo -u ubuntu git clone --branch "${RepoBranch}" "${RepoUrl}" /opt/psim/app
          cd /opt/psim/app
          sudo -u ubuntu python3 -m venv .venv
          sudo -u ubuntu .venv/bin/pip install --quiet --upgrade pip
          sudo -u ubuntu .venv/bin/pip install --quiet -r requirements.txt

          # Fetch secrets from SSM into a 0600 .env owned by ubuntu.
          # Written as a script (not inlined here) so it can be re-run after
          # you rotate a key, without redeploying the stack.
          cat > /usr/local/bin/psim-fetch-env <<'FETCH'
          #!/bin/bash
          # Pull this stack's SecureString parameters into /opt/psim/app/.env
          set -euo pipefail
          PREFIX="/psim/STACK_NAME_PLACEHOLDER"
          REGION="REGION_PLACEHOLDER"
          ENV_FILE="/opt/psim/app/.env"

          umask 077
          TMP="$(mktemp)"
          trap 'rm -f "$TMP"' EXIT

          {
            echo "# Generated by psim-fetch-env at $(date -Is)."
            echo "# Source of truth is SSM ${PREFIX}/*. Do not edit by hand."
            echo "PSIM_SCENARIO=case_001"
            echo "PSIM_MODEL=claude-opus-4-8"
            echo "PSIM_PORT=8091"
            echo "PSIM_STREAM_TTS=1"
            echo "PSIM_LOG_DIR=logs"
          } > "$TMP"

          # --with-decryption is what turns SecureString ciphertext back into
          # the value; it requires the kms:Decrypt grant in the instance role.
          for KEY in ANTHROPIC_API_KEY GROQ_API_KEY ELEVENLABS_API_KEY \
                     LIVEKIT_URL LIVEKIT_API_KEY LIVEKIT_API_SECRET; do
            VAL="$(aws ssm get-parameter \
                     --name "${PREFIX}/${KEY}" \
                     --with-decryption \
                     --region "${REGION}" \
                     --query 'Parameter.Value' \
                     --output text 2>/dev/null || echo '')"
            if [ -z "$VAL" ] || [ "$VAL" = "None" ]; then
              echo "WARNING: ${KEY} not set in SSM" >&2
              VAL=""
            fi
            printf '%s=%s\n' "$KEY" "$VAL" >> "$TMP"
          done

          install -m 600 -o ubuntu -g ubuntu "$TMP" "$ENV_FILE"
          echo "Wrote ${ENV_FILE} (mode 600). Values NOT displayed."
          FETCH

          sed -i "s|STACK_NAME_PLACEHOLDER|${AWS::StackName}|g" /usr/local/bin/psim-fetch-env
          sed -i "s|REGION_PLACEHOLDER|${AWS::Region}|g" /usr/local/bin/psim-fetch-env
          chmod 755 /usr/local/bin/psim-fetch-env
          /usr/local/bin/psim-fetch-env || true

          # systemd unit for the LiveKit worker. Not enabled by default: the
          # patient should start when a session is actually booked, and the
          # keys may not be in SSM yet at first boot.
          cat > /etc/systemd/system/psim.service <<'UNIT'
          [Unit]
          Description=Anesthesia patient simulation (LiveKit worker)
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=ubuntu
          WorkingDirectory=/opt/psim/app
          ExecStartPre=/usr/local/bin/psim-fetch-env
          ExecStart=/opt/psim/app/.venv/bin/python -m app.livekit_agent dev
          Restart=on-failure
          RestartSec=5
          # Keep credentials out of the journal.
          StandardOutput=append:/opt/psim/app/logs/worker.log
          StandardError=append:/opt/psim/app/logs/worker.log

          [Install]
          WantedBy=multi-user.target
          UNIT

          install -d -o ubuntu -g ubuntu /opt/psim/app/logs
          systemctl daemon-reload

          echo "BOOTSTRAP COMPLETE" > /opt/psim/READY

Outputs:
  InstanceId:
    Description: EC2 instance id.
    Value: !Ref Instance

  PublicIp:
    Description: Public IP for SSH.
    Value: !GetAtt Instance.PublicIp

  SshCommand:
    Description: SSH in (uses the key pair you named).
    Value: !Sub 'ssh ubuntu@${Instance.PublicIp}'

  SsmSessionCommand:
    Description: Shell without opening SSH at all (needs AWS CLI + Session Manager plugin).
    Value: !Sub 'aws ssm start-session --target ${Instance} --region ${AWS::Region}'

  SecretsPathPrefix:
    Description: SSM path this instance is allowed to read.
    Value: !Sub '/psim/${AWS::StackName}'

  PutSecretsHint:
    Description: Load your keys from your own machine before starting the worker.
    Value: !Sub './deploy/aws/put_secrets.sh ${AWS::StackName} ${AWS::Region} /path/to/.env'
